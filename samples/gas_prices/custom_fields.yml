# TRMNL Private Plugin → Custom Fields
# Paste this into the "Custom Fields" YAML section in the plugin editor.
# Then set the Polling URL to:
#   https://gas.objectgraph.com/trmnl/{{ state }}

- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: life,finance
  description: |
    U.S. gas prices for any state, sourced from AAA's daily averages.
    Shows current regular, mid-grade, premium, and
    diesel for the selected state alongside the U.S. national average,
    plus the state-vs-US delta and the same fuel's price one year ago.
    Data is cached server-side for 24 hours so the upstream is polled at
    most once per day per state.
  email_address: gavi.narra@objectgraph.com

- keyname: state
  field_type: select
  name: State
  description: U.S. state for AAA gas prices (required)
  optional: false
  options:
    - Alabama: AL
    - Alaska: AK
    - Arizona: AZ
